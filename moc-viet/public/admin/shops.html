<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/img/logo-favicon.svg"><link rel="icon" type="image/png" href="/img/logo.png"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Duyệt Shop — Mộc Việt Admin</title>
  <link rel="stylesheet" href="/css/modern.css">
</head>
<body>
<div class="dash-layout">
  <aside class="dash-sidebar">
    <div class="dash-logo"><img src="/img/logo.png" alt="Mộc Việt" class="dash-logo-img"></div>
    <div class="dash-user-info">
      <div id="sidebar-email" class="dash-user-email">...</div>
      <div class="dash-user-role">Hệ thống Quản trị</div>
    </div>
    <nav class="dash-nav">
      <div class="dash-nav-label">Quản trị</div>
      <a href="/admin/shops.html" class="active"><span class="nav-icon"><img src="/icons/duyetShop.png" class="icon-img-sm" style="filter:brightness(10);opacity:.85" alt=""></span> Duyệt Shop</a>
      <a href="/admin/orders.html"><span class="nav-icon"><img src="/icons/product.png" class="icon-img-sm" style="filter:brightness(10);opacity:.85" alt=""></span> Đơn hàng</a>
      <a href="/admin/deals.html"><span class="nav-icon"><img src="/icons/deal.png" class="icon-img-sm" style="filter:brightness(10);opacity:.85" alt=""></span> Deal &amp; Sự kiện</a>
      <a href="/admin/users.html"><span class="nav-icon"><img src="/icons/profile.png" class="icon-img-sm" style="filter:brightness(10);opacity:.85" alt=""></span> Người dùng</a>
      <a href="/admin/revenue.html"><span class="nav-icon"><img src="/icons/wallet.png" class="icon-img-sm" style="filter:brightness(10);opacity:.85" alt=""></span> Doanh thu</a>
      <a href="/admin/categories.html"><span class="nav-icon"><img src="/icons/category.png" class="icon-img-sm" style="filter:brightness(10);opacity:.85" alt=""></span> Danh mục</a>
      <a href="/admin/settings.html"><span class="nav-icon"><img src="/icons/camera.png" class="icon-img-sm" style="filter:brightness(10);opacity:.85" alt=""></span> Cài đặt</a>
      <div class="dash-nav-label">Tài khoản</div>
      <a href="/admin/profile.html"><span class="nav-icon"></span> Hồ sơ cá nhân</a>
      <div class="dash-nav-label">Ứng dụng</div>
      <a href="/"><span class="nav-icon"><img src="/icons/arrow-left.png" class="icon-img-sm" style="filter:brightness(10);opacity:.85" alt=""></span> Xem trang chủ</a>
    </nav>
    <div class="dash-sidebar-footer">
      <button onclick="logout()" class="btn btn-ghost btn-sm btn-block" style="color:rgba(255,255,255,0.7)">Đăng xuất</button>
    </div>
  </aside>

  <main class="dash-content">
    <div class="dash-header">
      <div>
        <h2 class="dash-title">Quản lý Shop</h2>
        <p class="dash-subtitle">Phê duyệt và kiểm soát các đối tác bán hàng trên hệ thống.</p>
      </div>
      <div style="position:relative">
        <button class="navbar-icon-btn" id="notif-toggle" onclick="toggleNotif()">
          <img src="/icons/notification.png" alt="">
          <span class="notif-badge" id="notif-badge"></span>
        </button>
        <div class="notif-dropdown" id="notif-dropdown">
          <div class="notif-header">
            <span>Thông báo</span>
            <button onclick="markAllRead()" style="font-size:12px;background:none;border:none;color:var(--primary);cursor:pointer;font-weight:700">Đọc tất cả</button>
          </div>
          <div class="notif-list" id="notif-list"></div>
        </div>
      </div>
    </div>

    <!-- Stats cards -->
    <div class="stats-grid mb-4" id="stats-grid"></div>

    <div class="filter-bar">
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="setStatus('pending',this)">Chờ duyệt</button>
        <button class="filter-tab" onclick="setStatus('approved',this)">Đã duyệt</button>
        <button class="filter-tab" onclick="setStatus('rejected',this)">Từ chối</button>
        <button class="filter-tab" onclick="setStatus('',this)">Tất cả</button>
      </div>
    </div>

    <div id="shops-container">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
requireRole('admin');
document.getElementById('sidebar-email').textContent = getUser().email;
initDashNotif();

let currentStatus = 'pending';

window.onload = async () => {
  const stats = await api.get('/api/admin/stats');
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card">
      <div class="stat-icon"><img src="/icons/duyetShop.png" style="width:26px;height:26px;object-fit:contain;opacity:.75" alt=""></div>
      <div>
        <div class="stat-label">Tổng gian hàng</div>
        <div class="stat-value">${stats.total_shops||0}</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><img src="/icons/home.png" style="width:26px;height:26px;object-fit:contain;opacity:.75" alt=""></div>
      <div>
        <div class="stat-label">Shop hoạt động</div>
        <div class="stat-value">${stats.approved_shops||0}</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><img src="/icons/wait_confirmation.png" style="width:26px;height:26px;object-fit:contain;opacity:.75" alt=""></div>
      <div>
        <div class="stat-label">Chờ phê duyệt</div>
        <div class="stat-value">${stats.pending_shops||0}</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><img src="/icons/product.png" style="width:26px;height:26px;object-fit:contain;opacity:.75" alt=""></div>
      <div>
        <div class="stat-label">Tổng sản phẩm</div>
        <div class="stat-value">${stats.total_products||0}</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><img src="/icons/cart.png" style="width:26px;height:26px;object-fit:contain;opacity:.75" alt=""></div>
      <div>
        <div class="stat-label">Tổng đơn hàng</div>
        <div class="stat-value">${stats.total_orders||0}</div>
      </div>
    </div>`;
  loadShops();
};

function setStatus(s, el) {
  currentStatus = s;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  loadShops();
}

async function loadShops() {
  const c = document.getElementById('shops-container');
  c.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  const url = currentStatus ? `/api/admin/shops?status=${currentStatus}` : '/api/admin/shops';
  const shops = await api.get(url);
  renderShops(shops);
}

function renderShops(shops) {
  const c = document.getElementById('shops-container');
  if (!shops.length) {
    c.innerHTML = '<div class="empty-state"><div class="empty-icon"></div><p>Không có shop nào trong danh sách này</p></div>';
    return;
  }
  c.innerHTML = `<div style="display:grid;gap:16px">${shops.map(s => `
    <div class="shop-card">
      <div class="shop-icon"></div>
      <div class="shop-info" style="flex:1">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
          <div class="shop-name">${s.name}</div>
          ${shopStatusBadge(s.status)}
        </div>
        <div class="shop-email"><img src="/icons/profile.png" style="width:14px;height:14px;object-fit:contain;vertical-align:middle;opacity:.6;margin-right:4px" alt=""> ${s.seller_email}</div>
        ${s.description?`<div class="shop-desc">${s.description}</div>`:''}
        <div class="shop-date">Ngày đăng ký: ${fmtDate(s.created_at)}</div>
        <div class="shop-actions">
          ${s.status === 'pending' ? `
            <button class="btn btn-primary btn-sm" onclick="approveShop(${s.id},this)">Duyệt shop ngay</button>
            <button class="btn btn-ghost btn-sm" style="color:#dc2626" onclick="rejectShop(${s.id},this)">Từ chối</button>
          ` : s.status === 'approved' ? `
            <button class="btn btn-ghost btn-sm" style="color:#dc2626" onclick="rejectShop(${s.id},this)">Thu hồi quyền</button>
          ` : `
            <button class="btn btn-primary btn-sm" onclick="approveShop(${s.id},this)">Phê duyệt lại</button>
          `}
        </div>
      </div>
    </div>`).join('')}</div>`;
}

function shopStatusBadge(s) {
  const map = { pending:'badge-warning', approved:'badge-success', rejected:'badge-danger' };
  const lbl = { pending:'Chờ duyệt', approved:'Đã duyệt', rejected:'Từ chối' };
  return `<span class="badge ${map[s]}">${lbl[s]}</span>`;
}

async function approveShop(id, btn) {
  if (!confirm('Duyệt shop này?')) return;
  btn.disabled = true;
  const res = await api.patch(`/api/admin/shops/${id}/approve`);
  if (res.success) { toast('Đã duyệt shop thành công'); loadShops(); }
  else { toast(res.message, 'error'); btn.disabled = false; }
}
async function rejectShop(id, btn) {
  if (!confirm('Từ chối shop này?')) return;
  btn.disabled = true;
  const res = await api.patch(`/api/admin/shops/${id}/reject`);
  if (res.success) { toast('Đã từ chối shop'); loadShops(); }
  else { toast(res.message, 'error'); btn.disabled = false; }
}
</script>
</body>
</html>
