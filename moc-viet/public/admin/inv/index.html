<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nam Khánh — Quản lý sản phẩm & doanh thu</title>
    <link rel="icon" type="image/png" href="/admin/inv/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/admin/inv/assets/index-DPc7HcZ_.js"></script>
    <link rel="stylesheet" crossorigin href="/admin/inv/assets/index-BMx55rgF.css">
    <style>
      /* ── Responsive overrides ── */
      #bonci-ham {
        display: none;
        position: fixed;
        top: 10px; left: 10px;
        z-index: 200;
        width: 38px; height: 38px;
        background: #E53935;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0,0,0,.25);
        flex-shrink: 0;
      }
      #bonci-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.45);
        z-index: 99;
      }
      @media (max-width: 768px) {
        /* Sidebar trượt ra ngoài màn hình, hiện lên khi mở */
        aside.w-60 {
          position: fixed !important;
          top: 0; left: 0;
          height: 100dvh !important;
          transform: translateX(-100%);
          transition: transform .3s ease;
          z-index: 100;
        }
        body.bonci-open aside.w-60 {
          transform: translateX(0);
          box-shadow: 4px 0 24px rgba(0,0,0,.18);
        }
        body.bonci-open #bonci-overlay { display: block; }
        /* Nút hamburger hiện trên mobile */
        #bonci-ham { display: flex !important; }
        /* Content bù vào khoảng nút hamburger */
        main.flex-1 { padding-top: 3.25rem !important; }
        /* Stat cards: 2 cột thay vì 4 */
        .grid-cols-4 {
          grid-template-columns: repeat(2, minmax(0,1fr)) !important;
        }
        /* Drawer form full-width */
        .w-\[480px\] { width: 100% !important; right: 0 !important; }
        /* Giảm padding trang */
        .p-6 { padding: 1rem !important; }
        .p-8 { padding: 1rem !important; }
        /* Chart chiều cao nhỏ hơn trên mobile */
        .h-72 { height: 13rem !important; }
        .h-48 { height: 10rem !important; }
        /* Max width modal về full trên mobile */
        .max-w-2xl, .max-w-3xl, .max-w-4xl { max-width: calc(100vw - 2rem) !important; }
        /* Form grid 2 cột về 1 cột */
        .grid-cols-2 { grid-template-columns: repeat(1, minmax(0,1fr)) !important; }
      }
      @media (max-width: 480px) {
        .grid-cols-4 {
          grid-template-columns: repeat(1, minmax(0,1fr)) !important;
        }
        .text-2xl { font-size: 1.25rem !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="bonci-overlay"></div>
    <button id="bonci-ham" aria-label="Mở menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <script>
      (function () {
        const ham     = document.getElementById('bonci-ham');
        const overlay = document.getElementById('bonci-overlay');
        function open()  { document.body.classList.add('bonci-open'); }
        function close() { document.body.classList.remove('bonci-open'); }
        ham.addEventListener('click', function () {
          document.body.classList.contains('bonci-open') ? close() : open();
        });
        overlay.addEventListener('click', close);
        // Đóng sidebar khi bấm link trong nav (React Router thay trang)
        const root = document.getElementById('root');
        root.addEventListener('click', function (e) {
          const link = e.target.closest('aside a, aside button');
          if (link) close();
        });
      })();
    </script>

    <!-- Datalist cho autocomplete nhà cung cấp và đơn vị -->
    <datalist id="bonci-distributor-dl"></datalist>
    <datalist id="bonci-unit-dl"></datalist>
    <script>
      (function () {
        function loadBonciMeta() {
          var token = localStorage.getItem('bonci_token');
          if (!token) { setTimeout(loadBonciMeta, 2000); return; }
          fetch('/api/inv/products/meta', {
            headers: { 'Authorization': 'Bearer ' + token }
          })
          .then(function(r) { return r.ok ? r.json() : null; })
          .then(function(data) {
            if (!data) return;
            var dList = document.getElementById('bonci-distributor-dl');
            var uList = document.getElementById('bonci-unit-dl');
            if (dList && data.distributors) {
              dList.innerHTML = data.distributors.map(function(d) {
                return '<option value="' + d.replace(/"/g, '&quot;') + '">';
              }).join('');
            }
            if (uList && data.units) {
              uList.innerHTML = data.units.map(function(u) {
                return '<option value="' + u.replace(/"/g, '&quot;') + '">';
              }).join('');
            }
          })
          .catch(function() {});
        }
        // Load ngay khi trang sẵn sàng
        setTimeout(loadBonciMeta, 1500);
        // Reload khi focus vào input autocomplete để luôn cập nhật mới nhất
        document.addEventListener('focusin', function(e) {
          var list = e.target && e.target.getAttribute && e.target.getAttribute('list');
          if (list === 'bonci-distributor-dl' || list === 'bonci-unit-dl') {
            loadBonciMeta();
          }
        });
      })();
    </script>
  </body>
</html>
