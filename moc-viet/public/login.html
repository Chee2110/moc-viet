<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/img/logo-favicon.svg"><link rel="icon" type="image/png" href="/img/logo.png"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Đăng nhập — Mộc Việt</title>
  <link rel="stylesheet" href="/css/modern.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><img src="/img/logo.png" alt="Mộc Việt" class="auth-logo-img"></div>
    <h2 class="auth-title">Chào mừng trở lại</h2>
    <p class="auth-subtitle">Tiếp tục hành trình khám phá thủ công Việt.</p>

    <div id="error-msg" class="alert alert-danger" style="display:none"></div>

    <!-- Google Sign-In -->
    <div id="google-btn-wrap" style="display:none;margin-bottom:16px">
      <div id="google-signin-btn"></div>
      <div class="auth-divider"><span>hoặc</span></div>
    </div>

    <form onsubmit="doLogin(event)">
      <div class="form-group">
        <label class="form-label">Email <span class="req">*</span></label>
        <input type="email" id="email" class="form-control" placeholder="email@mocviet.vn" required>
      </div>
      <div class="form-group">
        <label class="form-label">Mật khẩu <span class="req">*</span></label>
        <div style="position:relative">
          <input type="password" id="password" class="form-control" placeholder="••••••••" required style="padding-right:44px">
          <button type="button" onclick="togglePwd()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:12px;color:var(--text-muted)" id="pwd-eye">Hiện</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">Đăng nhập</button>
    </form>



    <div class="auth-footer">
      Chưa có tài khoản? <a href="/register.html" style="font-weight:700">Đăng ký bán hàng</a>
    </div>
    <div class="auth-footer" style="margin-top:8px">
      <a href="/buyer/track.html" style="color:var(--text-muted);font-size:13px">Tra cứu đơn hàng không cần đăng nhập</a>
    </div>
    <div class="auth-footer" style="margin-top:8px">
      <a href="/" style="color:var(--text-muted);font-size:13px">Quay lại trang chủ</a>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
if (isLoggedIn()) {
  const u = getUser();
  if (u.role === 'admin') window.location.href = '/admin/shops.html';
  else if (u.role === 'seller') window.location.href = '/seller/dashboard.html';
  else window.location.href = '/buyer/orders.html';
}

function togglePwd() {
  const inp = document.getElementById('password');
  const eye = document.getElementById('pwd-eye');
  if (inp.type === 'password') { inp.type = 'text'; eye.textContent = 'Ẩn'; }
  else { inp.type = 'password'; eye.textContent = 'Hiện'; }
}

async function doLogin(e) {
  e.preventDefault();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('login-btn');
  const errEl    = document.getElementById('error-msg');
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Đang đăng nhập...';
  const res = await api.post('/api/auth/login', { email, password });
  btn.disabled = false; btn.textContent = 'Đăng nhập';
  if (res && res.token) {
    saveAuth(res.token, res.user);
    toast('Đăng nhập thành công!');
    setTimeout(() => {
      const r = res.user.role;
      if (r === 'admin') window.location.href = '/admin/shops.html';
      else if (r === 'seller') window.location.href = '/seller/dashboard.html';
      else window.location.href = '/buyer/orders.html';
    }, 500);
  } else {
    errEl.textContent = res?.message || 'Đăng nhập thất bại';
    errEl.style.display = 'block';
  }
}

async function handleGoogleCredential(response) {
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('error-msg');
  errEl.style.display = 'none';
  const res = await api.post('/api/auth/google', { credential: response.credential });
  if (res && res.token) {
    saveAuth(res.token, res.user);
    toast('Đăng nhập Google thành công!');
    setTimeout(() => {
      const r = res.user.role;
      if (r === 'admin') window.location.href = '/admin/shops.html';
      else if (r === 'seller') window.location.href = '/seller/dashboard.html';
      else window.location.href = '/buyer/orders.html';
    }, 500);
  } else {
    errEl.textContent = res?.message || 'Đăng nhập Google thất bại';
    errEl.style.display = 'block';
  }
}

// Load Google config
fetch('/api/auth/config').then(r => r.json()).then(cfg => {
  if (!cfg.google_client_id) return;
  document.getElementById('google-btn-wrap').style.display = 'block';
  const script = document.createElement('script');
  script.src = 'https://accounts.google.com/gsi/client';
  script.onload = () => {
    google.accounts.id.initialize({
      client_id: cfg.google_client_id,
      callback: handleGoogleCredential,
    });
    google.accounts.id.renderButton(document.getElementById('google-signin-btn'), {
      theme: 'outline', size: 'large', width: '100%', text: 'signin_with', locale: 'vi'
    });
  };
  document.head.appendChild(script);
});
</script>
</body>
</html>
